services:
  connect:
    build: {context: ../../deploy/connect}   # canonical Dockerfile lives in deploy/
    container_name: banking-connect
    hostname: connect
    ports: ["${CONNECT_EXTERNAL_PORT:-8083}:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: banking-connect
      CONFIG_STORAGE_TOPIC: banking_connect_configs
      OFFSET_STORAGE_TOPIC: banking_connect_offsets
      STATUS_STORAGE_TOPIC: banking_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
