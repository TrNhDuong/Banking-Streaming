name: CI - Test & Quality

on:
  push:
    branches:
      - main
      - dev
      - devops
      - test
  pull_request:
    branches:
      - main
      - dev
      - devops

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax
        run: |
          python -m compileall cli/ simulator/

      - name: Run Pytest suite
        run: |
          pytest --tb=short -v

  compose-validate:
    name: Validate Docker Compose Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Local Compose Configuration
        run: |
          docker compose --env-file .env.local.example -f infra/docker-compose.local.yml config --quiet

      - name: Validate Production Compose Configuration
        run: |
          docker compose --env-file .env.production.example -f deploy/docker-compose.prod.yml config --quiet
