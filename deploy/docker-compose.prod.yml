# Production docker-compose — Kafka Connect only.
# Requires external PostgreSQL and Kafka (managed services or self-hosted).
# Usage: docker compose --env-file .env.production -f deploy/docker-compose.prod.yml up -d

services:
  connect:
    build: {context: connect}     # deploy/connect/Dockerfile
    image: ${CONNECT_IMAGE:-banking-connect:latest}
    container_name: banking-connect
    restart: unless-stopped
    ports: ["${CONNECT_EXTERNAL_PORT:-8083}:8083"]
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      GROUP_ID: banking-connect
      CONFIG_STORAGE_TOPIC: banking_connect_configs
      OFFSET_STORAGE_TOPIC: banking_connect_offsets
      STATUS_STORAGE_TOPIC: banking_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-3}"
      OFFSET_STORAGE_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-3}"
      STATUS_STORAGE_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-3}"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
